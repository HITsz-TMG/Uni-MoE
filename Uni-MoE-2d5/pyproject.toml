[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unimoe2d5-inference"
version = "0.1.0"
description = "Out-of-tree vLLM and Hugging Face inference support for UniMoE-2.5"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [{ name = "UniMoE Team" }]
keywords = ["multimodal", "mixture-of-experts", "vllm", "ascend", "npu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "packaging",
  "pillow",
  "requests",
  "soundfile",
]

[project.optional-dependencies]
demo = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "imageio-ffmpeg>=0.6,<0.7",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.29,<1",
]
test = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
  "tomli>=2; python_version < '3.11'",
]

[project.entry-points."vllm.general_plugins"]
unimoe2d5 = "unimoe2d5.plugin:register"

[project.urls]
Documentation = "https://github.com/Tiachi/Uni-MoE-2d5-OpenSource#readme"
Repository = "https://github.com/Tiachi/Uni-MoE-2d5-OpenSource"
Issues = "https://github.com/Tiachi/Uni-MoE-2d5-OpenSource/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
