name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install portable test dependencies
        run: python -m pip install -e ".[test,demo]"
      - name: Check maintained wrapper code
        run: >-
          ruff check
          src/unimoe2d5/__init__.py
          src/unimoe2d5/compat.py
          src/unimoe2d5/plugin.py
          examples demo scripts tests
      - name: Run portable contract tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
